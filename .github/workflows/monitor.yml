name: Tailscale Monitor

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/5 * * * *' # если используете расписание

jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Требуется для записи изменений в репозиторий

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run status check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
        run: node monitor.js

      - name: Pull latest changes before commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No rebase needed"

      - name: Commit and push changes if state changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: state.json
          commit_message: "Update device state [skip ci]"
          skip_ci: true
